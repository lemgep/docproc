; ==============================================================
; Standalone document processor (no Metka). Linux / systemd.
; Paths must be POSIX and, for base_dir, absolute.
; ==============================================================
[app]
base_dir       = /opt/docproc
incoming_dir   = incoming
clients_dir    = clients
errors_dir     = errors
logs_dir       = logs
db_path        = data/clients.db
lock_path      = data/app.lock

[recognition]
; linear = all linear symbologies (Code 128/39, EAN, UPC, DataBar, ...)
; all    = everything zxing-cpp supports (incl. QR, DataMatrix, PDF417, Aztec)
; comma  = exact list, e.g. "Code128,Code39,EAN13"
formats = linear
; Page render resolutions tried in order until a barcode is found.
dpi_candidates = 300,400
max_pages = 0          ; 0 = all pages
try_rotate = true
try_downscale = true
try_invert = true

[processing]
extensions = .pdf,.png,.jpg,.jpeg,.tif,.tiff,.bmp
stability_seconds = 5
stability_checks = 3
poll_interval_seconds = 5
final_name_template = {client_id} {full_name}
; duplicate_policy: counter | timestamp | overwrite | skip
duplicate_policy = counter

[logging]
level = INFO
max_bytes = 5242880
backup_count = 5
